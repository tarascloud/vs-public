name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Studio — lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Prisma only needs a syntactically valid URL to generate the client.
      DATABASE_URL: postgresql://vs:vs@localhost:5432/vs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # The gate: the app must compile.
      - run: npm run build
      # Reported, not enforced: both are red upstream (see README → Notes on this
      # public release). Flip continue-on-error off once they are clean.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
        continue-on-error: true

  mempalace:
    name: MemPalace — scrubber tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mempalace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest scrubber/tests -q
