# required-secrets.yaml — Manifest of secrets that MUST exist per Infisical path.
#
# Consumed by infra/scripts/secrets-audit.sh (daily cron 07:00 UTC on VPS).
# If a listed key is missing from its Infisical path, the auditor sends a
# Telegram alert and exits non-zero. Prevents silent regressions like the
# one on 2026-04-19 where INTERNAL_API_SECRET disappeared from /vs and
# auto-planning stayed broken for hours without any surface signal.
#
# Keys are grouped by Infisical path (env=prod, project=VS workspace).
# Add a key here the moment any script, cron, or container starts
# depending on it.

paths:
  /vs:
    - CRON_SECRET
    - INTERNAL_API_SECRET
    - NEXTAUTH_SECRET
    - NEXTAUTH_URL
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - TG_BOT_TOKEN
    - TELEGRAM_WEBHOOK_SECRET
    # ARC-20260507-0002: required for runtime ID lookup in sh-workflow + waitlist
    - OWNER_EMAIL
    - TG_CHAT_OWNER

  /pd-prod:
    - DATABASE_URL
    - REDIS_URL
    - REDIS_PASSWORD
    - NEXTAUTH_SECRET
    - NEXTAUTH_URL
    - AUTH_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - TELEGRAM_BOT_TOKEN

  /pd-dev:
    - DATABASE_URL
    - REDIS_URL
    - REDIS_PASSWORD

  # /sh — separate Infisical project (627acf9c-…, root path); secrets-audit.sh
  # maps /sh to that project automatically.
  /sh:
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    # sh is NextAuth v5 — the secret key is AUTH_SECRET (NEXTAUTH_SECRET was a
    # manifest typo; the /sh project and .sh.env only ever had AUTH_SECRET).
    - AUTH_SECRET
    - TELEGRAM_BOT_TOKEN
    - HF_TOKEN
  /mempalace:
    - MEMPALACE_BEARER_TOKEN

  /infra:
    # DEV-20260601-0018: STATUS_READER_PASSWORD lives in /infra path (injected via infra.env.tmpl
    # which is included by status.env.tmpl). Secret confirmed present in .status.env.
    # Semantic home is /infra since it's shared with pg/redis infra credentials.
    - PG_SUPERUSER_PASSWORD
    - REDIS_PASSWORD
    - STATUS_READER_PASSWORD
    - STATUS_API_TOKEN

  # ── PENDING-IMPORT (REV-2026-06-11) ──────────────────────────────────
  # These env files are still managed manually in /opt/docker/secrets/.
  # Templates exist in infra/infisical-agent/templates/, but the VALUES are
  # not in Infisical yet (agent identity is read-only; import needs a
  # write-capable login — see infra/infisical-agent/import-manual-envs.sh).
